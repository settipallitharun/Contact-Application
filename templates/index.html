<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Contact Manager Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Contact Manager Pro</h1>
            <div class="header-actions">
                <button class="btn-export" onclick="exportContacts()">📥 Export</button>
                <button class="btn-primary" onclick="openModal()">➕ Add Contact</button>
            </div>
        </header>

        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="🔍 Search contacts..." oninput="filterContacts()">
            <select id="categoryFilter" onchange="filterContacts()">
                <option value="">All Categories</option>
                <option value="Family">Family</option>
                <option value="Friends">Friends</option>
                <option value="Work">Work</option>
                <option value="General">General</option>
            </select>
            <button class="btn-filter" onclick="toggleFavorites()">⭐ Favorites</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalContacts">0</span>
                <span class="stat-label">Total Contacts</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="favoriteCount">0</span>
                <span class="stat-label">Favorites</span>
            </div>
        </div>

        <div id="contactsGrid" class="contacts-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Contact</h2>
            <form id="contactForm" onsubmit="saveContact(event)">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="General">General</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                        <option value="Work">Work</option>
                    </select>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="favorite">
                    <label for="favorite">⭐ Mark as Favorite</label>
                </div>
                <button type="submit" class="btn-primary">Save Contact</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
